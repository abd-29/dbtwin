name: dbtwin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check src ui tests app.py config.py

      - name: Check lint
        run: poetry run ruff check src ui tests app.py config.py

      - name: Check types
        run: poetry run mypy src ui app.py config.py

      - name: Run tests
        run: poetry run pytest -q